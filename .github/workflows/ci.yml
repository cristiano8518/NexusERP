name: NexusERP CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexuserp
          POSTGRES_USER: nexuserp
          POSTGRES_PASSWORD: nexuserp_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements/dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Migrate & test with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgres://nexuserp:nexuserp_secret@localhost:5432/nexuserp
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          SECRET_KEY: ci-secret-key
          DEBUG: "1"
        run: |
          python manage.py migrate --noinput
          pytest \
            --cov=apps/tasks \
            --cov=apps/finance \
            --cov=apps/warehouse \
            --cov=apps/integrations \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=40

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
